name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,benchmark]"
      - run: python -m pytest tests benchmarks
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
  opencl-pocl:
    runs-on: ubuntu-latest
    env:
      PACHO_REQUIRE_OPENCL: '1'
      PACHO_OPENCL_DEVICE: '0:0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd
      - run: python -m pip install ".[opencl,dev,benchmark]"
      - run: pacho devices
      - run: python -m pytest
